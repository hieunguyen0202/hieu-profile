<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="KCSA certification badge">
  <defs>
    <linearGradient id="g-kcsa" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="glow-kcsa" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <polygon points="100,8 178,52 178,148 100,192 22,148 22,52" fill="#0a0a0f" stroke="url(#g-kcsa)" stroke-width="6" filter="url(#glow-kcsa)"/>
  <polygon points="100,28 160,62 160,138 100,172 40,138 40,62" fill="none" stroke="url(#g-kcsa)" stroke-width="1.5" opacity="0.45"/>
  <text x="100" y="98" text-anchor="middle" font-family="Outfit, Arial, sans-serif" font-size="24" font-weight="800" fill="#f4f4f5">KCSA</text>
  <text x="100" y="122" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" letter-spacing="1.5" fill="#ef4444">SECURITY</text>
</svg>
